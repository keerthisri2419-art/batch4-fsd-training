<!DOCTYPE html>
<html>
<head>
    <title>Register - Campus Fest</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>

        <h2>🎉 CAMPUS<span>FEST</span></h2>

        <div>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </div>

    </nav>


    <!-- Registration Section -->
    <section class="page">

        <p class="small-title">🎟️ JOIN THE FEST</p>

        <h1>Event Registration</h1>

        <p>
            Fill in your details and select the event you want to participate in.
        </p>


        <!-- Registration Form -->
        <form action="gallery.html">


            <label>Full Name</label>

            <input
                type="text"
                placeholder="Enter your name"
                required
            >


            <label>Email Address</label>

            <input
                type="email"
                placeholder="Enter your email"
                required
            >


            <label>Phone Number</label>

            <input
                type="text"
                placeholder="Enter your phone number"
                required
            >


            <label>Department</label>

            <input
                type="text"
                placeholder="Enter your department"
                required
            >


            <label>Select Event</label>

            <select required>

                <option value="">
                    Select an event
                </option>

                <option>
                    Coding Contest
                </option>

                <option>
                    Paper Presentation
                </option>

                <option>
                    Quiz Competition
                </option>

                <option>
                    Dance
                </option>

                <option>
                    Singing
                </option>

                <option>
                    Fashion Show
                </option>

                <option>
                    Photography
                </option>

                <option>
                    Sports
                </option>

            </select>


            <!-- Submit Button -->
            <button type="submit">
                🎉 Submit Registration
            </button>

        </form>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            ©️ 2026 Campus Fest | College Festival
        </p>

    </footer>

</body>
</html>
