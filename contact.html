<!DOCTYPE html>
<html>
<head>
    <title>Contact - Campus Fest</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>🎉 CAMPUS<span>FEST</span></h2>

        <div>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>


    <section class="page">

        <p class="small-title">📞 GET IN TOUCH</p>

        <h1>Contact Us</h1>

        <p>
            Have questions about the festival? Contact our event team.
        </p>


        <div class="contact-container">

            <div class="contact-card pink">
                <div class="icon">📧</div>
                <h3>Email</h3>
                <p>campusfest@gmail.com</p>
            </div>


            <div class="contact-card purple">
                <div class="icon">📱</div>
                <h3>Phone</h3>
                <p>+91 98765 43210</p>
            </div>


            <div class="contact-card blue">
                <div class="icon">📍</div>
                <h3>Venue</h3>
                <p>College Auditorium</p>
            </div>

        </div>


        <form>

            <h2>💌 Send Us a Message</h2>

            <label>Your Name</label>
            <input type="text" placeholder="Enter your name">


            <label>Your Email</label>
            <input type="email" placeholder="Enter your email">


            <label>Your Message</label>
            <textarea
                placeholder="Write your message">
            </textarea>


            <button type="submit">
                📩 Send Message
            </button>

        </form>

    </section>


    <footer>
        <p>©️ 2026 Campus Fest | College Festival</p>
    </footer>

</body>
</html>
